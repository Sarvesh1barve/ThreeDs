stages: [test, pages]

test:
  image: python:3.12-slim
  stage: test
  script:
    - pip install -r requirements-dev.txt
    - pytest -q

pages:
  image: alpine:3.20
  stage: pages
  script:
    - mkdir -p public
    - cp -r frontend/* public/
    - if [ -n "$BACKEND_PUBLIC_URL" ]; then printf "window.THREEDS_API_BASE='%s';\n" "$BACKEND_PUBLIC_URL" > public/assets/config.js; fi
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

